name: merch-fetch
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON object of {filename: url} to fetch into merch/print'
        required: true
        type: string
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Download renders and build thumbnails
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: python3 tools/merch_fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merch/
          git commit -m "Add merch renders fetched by workflow" || echo "nothing to commit"
          git push
